name: my-cookbook

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    image: my-cookbook:latestlocal
    pull_policy: never
    env_file:
      - envfiles/local.env
    entrypoint:
      - wait-for-it
      - db:5432
      - --timeout=0
      - --strict
      - --
    command: /app/scripts/app-command.sh --reload
    ports:
      - "8000:8000"
    volumes:
      - '..:/app:cached'
      - './app/assets/gunicorn:/var/gunicorn:cached'
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    env_file:
      - envfiles/local.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: --fsync=off

volumes:
  pgdata:
